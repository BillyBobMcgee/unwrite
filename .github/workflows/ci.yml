name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ["22.x", "24.x"]
        exclude:
          - os: windows-latest
            node: "22.x"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # better-sqlite3 requires Node 22+, and ships prebuilds per ABI. `npm ci`
      # falls back to building from source when one is missing, which needs the
      # platform toolchain.
      - run: npm ci

      - run: npm run typecheck
      - run: npm run build
      - run: npm test

name: Publish

# Publishes to npm when a version tag is pushed:
#   npm version minor && git push --follow-tags
#
# Requires an NPM_TOKEN secret (an npm automation token) in the repo settings.
# --provenance needs a public repo and a `repository` field in package.json;
# drop the flag if you publish from a private repo.
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm provenance

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # prepublishOnly rebuilds dist/ and reruns the suite before the upload.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
